name: Headless tests and packaging
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1 python3-gi python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # Use system GI through its distro path; NumPy/DSP packages remain in pip.
      - run: python -m pip install '.[dev,benchmark]'
      - run: python -m pytest -ra
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
          MPLBACKEND: Agg
      - run: python -m build
      - run: python scripts/check_public_package.py dist
